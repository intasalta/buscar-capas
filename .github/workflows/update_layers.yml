name: Actualizar Catálogo WMS INTA

on:
  schedule:
    # Se ejecuta automáticamente todos los domingos a las 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub

permissions:
  contents: write

jobs:
  update-layers:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar indexación de capas WMS
        run: |
          python index_layers.py

      - name: Guardar cambios si hay actualizaciones
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add layers_cache.json
          if git diff --staged --quiet; then
            echo "No hay cambios en las capas."
          else
            git commit -m "chore: actualización automática del catálogo de capas WMS"
            git push
          fi
